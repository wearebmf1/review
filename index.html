<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>

  <!-- No-JS fallback (does not forward parameters) -->
  <meta http-equiv="refresh" content="1; url=https://electricair.com.mx/">
  <link rel="canonical" href="https://electricair.com.mx/">

  <script>
    (function () {
      var destination = "https://electricair.com.mx/";
      var incoming = window.location.search;   // e.g. ?utm_source=fb&fbclid=123
      var hash = window.location.hash;

      var target = destination;
      if (incoming) {
        target += (destination.indexOf("?") > -1 ? "&" : "?") + incoming.substring(1);
      }
      target += hash;

      window.location.replace(target);
    })();
  </script>

  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
           display: flex; align-items: center; justify-content: center;
           height: 100vh; margin: 0; color: #333; }
  </style>
</head>
<body>
  <p>Redirecting… If nothing happens,
     <a id="fallback" href="https://electricair.com.mx/">click here</a>.</p>
</body>
</html>
